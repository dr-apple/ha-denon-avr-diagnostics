# Complete self-contained Denon/Marantz AVR diagnostics card.
# Paste everything below into a Home Assistant Manual card.
# Replace the example entity IDs with the IDs created on your system.
# Required HACS frontend cards are listed in examples/README.md.
{
  "type": "custom:tabbed-card",
  "options": {
    "defaultTabIndex": 0
  },
  "styles": {
    "--mdc-theme-primary": "#6eb52f",
    "--mdc-tab-text-label-color-default": "rgba(225,225,225,0.62)",
